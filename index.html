@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
:root{--ink:#14302A;--forest:#1B5E4A;--teal:#0E7C7B;--sage:#6B9080;--cream:#F6F2E9;--paper:#FFFFFF;--line:#E4DDcd;--line2:#EDE7D9;--coral:#C75B39;--rose:#B0476A;--amber:#D99A2B;--muted:#5C6B63;--red:#C0492F;}
*{box-sizing:border-box;}
.eca-root{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 500px at 88% -8%,rgba(14,124,123,.10),transparent 60%),radial-gradient(700px 600px at -6% 100%,rgba(199,91,57,.08),transparent 60%),var(--cream);}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:1;}
.hd{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(246,242,233,.85);border-bottom:1px solid var(--line);}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--forest),var(--teal));font-family:'Fraunces';font-weight:700;font-size:19px;box-shadow:0 6px 18px rgba(27,94,74,.28);}
.brand b{font-family:'Fraunces';font-weight:600;font-size:18px;letter-spacing:-.2px;}
.brand .x{color:var(--sage);margin:0 4px;}
.brand small{color:var(--muted);font-size:11.5px;display:block;margin-top:-2px;letter-spacing:.3px;}
.seg{display:inline-flex;background:rgba(20,48,42,.06);border:1px solid var(--line);border-radius:999px;padding:3px;}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;font-size:13px;color:var(--muted);padding:7px 14px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.18s;}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(20,48,42,.10);}
.badge-proto{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--coral);border:1px dashed var(--coral);border-radius:999px;padding:4px 9px;text-transform:uppercase;background:rgba(199,91,57,.06);}
.section{padding:30px 0 60px;}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--teal);}
h1.hero{font-family:'Fraunces';font-weight:600;font-size:clamp(30px,5.4vw,50px);line-height:1.02;letter-spacing:-1.2px;margin:14px 0 12px;}
.hero em{font-style:italic;color:var(--forest);}
.lead{font-size:16px;color:var(--muted);max-width:600px;line-height:1.55;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 0 rgba(20,48,42,.02),0 14px 34px rgba(20,48,42,.05);}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:12px;padding:13px 22px;display:inline-flex;align-items:center;gap:8px;transition:.18s;font-size:15px;}
.btn-primary{background:linear-gradient(135deg,var(--forest),var(--teal));color:#fff;box-shadow:0 12px 26px rgba(27,94,74,.30);}
.btn-primary:hover{filter:brightness(1.07);transform:translateY(-1px);}
.btn-coral{background:linear-gradient(135deg,var(--coral),#d97a4f);color:#fff;box-shadow:0 12px 26px rgba(199,91,57,.28);}
.btn-coral:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:rgba(20,48,42,.04);}
.btn-sm{padding:9px 15px;font-size:13px;}
/* hero band */
.heroband{position:relative;overflow:hidden;border-radius:24px;padding:46px 38px;color:#fff;margin-top:6px;
 background:linear-gradient(135deg,#14302A 0%,#1B5E4A 55%,#0E7C7B 100%);box-shadow:0 22px 50px rgba(20,48,42,.22);}
.heroband::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.07);}
.heroband::before{content:"";position:absolute;left:-40px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:rgba(199,91,57,.18);}
.heroband .eyebrow{color:#9fd8c4;}
.heroband h1{color:#fff;}
.heroband .lead{color:rgba(255,255,255,.86);}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;position:relative;z-index:2;}
.quotes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:2;}
.qchip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;}
/* value props */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px;}
.vcard{padding:22px;border-radius:16px;}
.vico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:13px;}
.vcard h3{font-family:'Fraunces';font-weight:600;font-size:18px;margin:0 0 6px;}
.vcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}
.artic{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;}
.unitag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(27,94,74,.09);color:var(--forest);}
.plus{color:var(--sage);font-weight:800;}
/* success */
.scards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px;}
.scard{padding:18px;border-radius:16px;position:relative;}
.scard .av{width:40px;height:40px;border-radius:11px;color:#fff;display:grid;place-items:center;font-family:'Fraunces';font-weight:700;font-size:17px;}
.scard h4{margin:11px 0 1px;font-size:15px;font-weight:700;}
.scard .role{font-size:12px;color:var(--teal);font-weight:700;}
.scard .qt{font-size:13px;color:var(--ink);line-height:1.45;margin:10px 0 0;font-style:italic;}
.scard .rt{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:6px;}
/* form */
.formcard{padding:26px;border-radius:20px;margin-top:18px;}
.fsec{margin-bottom:22px;}
.fsec h3{font-family:'Fraunces';font-weight:600;font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:9px;}
.fsec .sub{font-size:13px;color:var(--muted);margin:0 0 12px;}
.opts{display:flex;gap:8px;flex-wrap:wrap;}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:10px 14px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s;}
.opt:hover{border-color:var(--sage);}
.opt.on{background:var(--forest);color:#fff;border-color:var(--forest);}
.skrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line2);}
.skrow .lbl{font-size:14px;font-weight:600;}
.dots{display:flex;gap:6px;flex-shrink:0;}
.dot{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--muted);transition:.12s;}
.dot.on{background:var(--forest);color:#fff;border-color:var(--forest);transform:scale(1.06);}
.analyze{display:grid;place-items:center;padding:80px 0;text-align:center;}
.spinner{width:62px;height:62px;border-radius:50%;border:4px solid rgba(27,94,74,.15);border-top-color:var(--forest);animation:spin .9s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes up{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.rise{animation:up .5s cubic-bezier(.2,.7,.2,1) both;}
.shimmer{background:linear-gradient(90deg,var(--muted),var(--forest),var(--muted));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.6s linear infinite;font-weight:700;}
@keyframes sh{to{background-position:-200% 0;}}
/* route cards */
.rcard{border-radius:18px;overflow:hidden;margin-bottom:16px;border:1px solid var(--line);background:var(--paper);box-shadow:0 14px 34px rgba(20,48,42,.06);}
.rtop{padding:20px 22px;color:#fff;position:relative;}
.rtop .tag{font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;}
.rtop h3{font-family:'Fraunces';font-weight:600;font-size:22px;margin:10px 0 2px;line-height:1.1;}
.rtop .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;}
.rtop .meta b{display:block;font-family:'Fraunces';font-size:15px;}
.rbody{padding:18px 22px;}
.why{font-size:13.5px;color:var(--ink);line-height:1.5;}
.why b{color:var(--forest);}
.price{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
@media(max-width:600px){.price{grid-template-columns:1fr;}.rtop .meta{gap:12px;}}
.pbox{border:1px solid var(--line);border-radius:13px;padding:14px;}
.pbox .k{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:6px;}
.pbox .v{font-family:'Fraunces';font-weight:600;font-size:21px;margin-top:6px;}
.pbox .d{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;}
.pbox.isa{background:linear-gradient(135deg,rgba(199,91,57,.07),rgba(217,154,43,.07));border-color:rgba(199,91,57,.25);}
.expand{border-top:1px solid var(--line2);margin-top:16px;padding-top:14px;}
.exptog{display:flex;align-items:center;gap:7px;color:var(--forest);font-weight:700;font-size:13px;cursor:pointer;background:none;border:0;font-family:inherit;padding:0;}
.tdim{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--sage);margin:14px 0 4px;}
.titem{display:flex;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line2);}
.titem:last-child{border:0;}
.tmicro{font-size:13.5px;font-weight:700;line-height:1.25;}
.tinst{font-size:11.5px;color:var(--muted);margin-top:3px;}
.modtag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;height:fit-content;white-space:nowrap;background:rgba(14,124,123,.12);color:var(--teal);}
.minihd{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--teal);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.morecta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,rgba(27,94,74,.06),rgba(14,124,123,.05));border:1px dashed var(--sage);margin-top:6px;}
/* admin */
.subseg{display:inline-flex;gap:4px;background:rgba(20,48,42,.05);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0 4px;}
.subseg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer;}
.subseg button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px rgba(20,48,42,.08);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;}
.kpi{padding:18px;border-radius:16px;}
.kpi .n{font-family:'Fraunces';font-weight:600;font-size:30px;line-height:1;}
.kpi .lab{font-size:12.5px;color:var(--muted);margin-top:6px;}
.kpi .proj{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--amber);text-transform:uppercase;margin-top:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
@media(max-width:780px){.grid2{grid-template-columns:1fr;}}
.rank-row{display:flex;align-items:center;gap:12px;padding:7px 0;}
.rank-bar{flex:1;height:9px;border-radius:999px;background:rgba(20,48,42,.07);overflow:hidden;}
.rank-bar>div{height:100%;border-radius:999px;}
.alertbar{display:flex;gap:10px;margin-top:6px;}
.abox{flex:1;border-radius:13px;padding:14px;text-align:center;}
.abox .n{font-family:'Fraunces';font-weight:600;font-size:26px;}
.abox .l{font-size:11.5px;font-weight:700;margin-top:2px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line);}
td{padding:11px 8px;border-bottom:1px solid var(--line2);vertical-align:middle;}
tr.clk{cursor:pointer;transition:.12s;}
tr.clk:hover{background:rgba(20,48,42,.03);}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.pill.alto{background:rgba(192,73,47,.14);color:var(--red);}
.pill.medio{background:rgba(217,154,43,.18);color:#9A6B12;}
.pill.bajo{background:rgba(27,94,74,.12);color:var(--forest);}
.progwrap{height:7px;border-radius:999px;background:rgba(20,48,42,.08);overflow:hidden;width:70px;}
.progwrap>div{height:100%;}
.drawer{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:4px 0 8px;}
.factor{display:flex;align-items:flex-start;gap:9px;font-size:13px;padding:6px 0;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.foot{padding:24px 0 40px;color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--line);margin-top:20px;line-height:1.6;}
.note{display:flex;gap:10px;align-items:flex-start;background:rgba(217,154,43,.10);border:1px dashed var(--amber);border-radius:13px;padding:13px 15px;font-size:12.5px;line-height:1.5;margin-top:18px;color:#7a5a14;}
